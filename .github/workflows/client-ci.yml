name: DevPortal offline client CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - name: Run standalone tests without secrets or private checkout
        run: python -m unittest discover -s tests -v

  windows-portable:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Run offline tests on Windows
        run: python -m unittest discover -s tests -v
      - name: Install pinned portable-build dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-build.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Build a windowed one-directory launcher with static UI
        run: python -m PyInstaller --noconfirm --onedir --windowed --name DevPortal --add-data "dev_portal/static;dev_portal/static" run_dev_portal.py
      - name: Smoke test native first-run startup and inspect portable folder
        shell: pwsh
        run: |
          $launcher = (Resolve-Path .\dist\DevPortal\DevPortal.exe).Path
          $versionCheck = Start-Process -FilePath $launcher -ArgumentList '--version' -PassThru -Wait
          if ($versionCheck.ExitCode -ne 0) { throw 'Portable launcher failed to start' }
          $process = Start-Process -FilePath $launcher -PassThru
          try {
            Start-Sleep -Seconds 2
            $process.Refresh()
            if ($process.HasExited) { throw 'First-run native dialog exited unexpectedly' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          if (-not (Test-Path .\dist\DevPortal\_internal\dev_portal\static\index.html)) { throw 'Static UI missing' }
          $bad = Get-ChildItem .\dist\DevPortal -Recurse -Force -File | Where-Object {
            $_.Name -match '(?i)(^\.env($|\.)|\.sqlite3?$|\.partial$|\.receipt\.json$|\.tar\.zst$|\.pem$|\.key$)'
          }
          if ($bad) { throw 'Unexpected private-data-like file in portable folder' }
          Compress-Archive -Path .\dist\DevPortal -DestinationPath .\DevPortal-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DevPortal-windows-x64
          path: DevPortal-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
