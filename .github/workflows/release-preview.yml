name: DevPortal Windows preview release

on:
  push:
    tags:
      - v0.2.0-rc.2

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Verify the tagged client version
        shell: pwsh
        run: |
          $version = (python -m dev_portal --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -ne "v${version}-rc.2") {
            throw 'Tag must match the reviewed preview client version'
          }
      - name: Run offline Windows tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned portable-build tools
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-build.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Build windowed standalone Windows x64 folder
        run: python -m PyInstaller --noconfirm --onedir --windowed --name DevPortal --add-data "dev_portal/static;dev_portal/static" run_dev_portal.py
      - name: Check native startup, UI and package boundaries; create checksums
        shell: pwsh
        run: |
          $launcher = (Resolve-Path .\dist\DevPortal\DevPortal.exe).Path
          $versionCheck = Start-Process -FilePath $launcher -ArgumentList '--version' -PassThru -Wait
          if ($versionCheck.ExitCode -ne 0) { throw 'Portable launcher did not start' }
          $process = Start-Process -FilePath $launcher -PassThru
          try {
            Start-Sleep -Seconds 2
            $process.Refresh()
            if ($process.HasExited) { throw 'First-run native dialog exited unexpectedly' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          if (-not (Test-Path .\dist\DevPortal\_internal\dev_portal\static\index.html)) { throw 'Static UI missing' }
          $bad = Get-ChildItem .\dist\DevPortal -Recurse -Force -File | Where-Object {
            $_.Name -match '(?i)(^\.env($|\.)|\.sqlite3?$|\.partial$|\.receipt\.json$|\.tar\.zst$|\.pem$|\.key$)'
          }
          if ($bad) { throw 'Private-data-like file in portable folder' }
          Compress-Archive -Path .\dist\DevPortal -DestinationPath .\DevPortal-windows-x64.zip
          $hash = (Get-FileHash .\DevPortal-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DevPortal-windows-x64.zip" | Set-Content -Encoding ascii .\SHA256SUMS.txt
          Write-Host "Windows portable ZIP SHA-256: $hash"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DevPortal-preview-v0.2.0-rc.2
          path: |
            DevPortal-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download this run's artifact and verify its SHA-256 and layout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name DevPortal-preview-v0.2.0-rc.2 --dir release-assets
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import re
          import zipfile
          with zipfile.ZipFile('release-assets/DevPortal-windows-x64.zip') as archive:
              names = archive.namelist()
          assert names and 'DevPortal/DevPortal.exe' in names
          assert any(name.endswith('/dev_portal/static/index.html') for name in names)
          assert all(name.startswith('DevPortal/') and '..' not in name.split('/') for name in names)
          bad = re.compile(r'(?i)(^\.env($|\.)|\.sqlite3?$|\.partial$|\.receipt\.json$|\.tar\.zst$|\.pem$|\.key$)')
          assert not any(bad.search(name.rsplit('/', 1)[-1]) for name in names)
          print('Verified release ZIP entries:', len(names))
          PY
      - name: Publish only the tested unsigned preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/DevPortal-windows-x64.zip release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "DevPortal $GITHUB_REF_NAME (preview)" \
            --notes-file .github/release-notes-v0.2.0-rc.2.md
